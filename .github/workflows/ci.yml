name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so every run checks against the same engine; bump deliberately.
  CLAUDE_CODE_VERSION: 2.1.332

jobs:
  scenes:
    name: Scenes rebuild byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/build-scene.mjs
      - name: Generated modules match the commit
        run: git diff --exit-code -- hooks/

  plugin:
    name: Validate and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: claude plugin validate .
      - run: claude plugin test .

  install-posix:
    name: Installer (${{ matrix.os }})
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - name: Install, install again, uninstall
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          echo '{"theme":"dark"}' > "$CLAUDE_CONFIG_DIR/settings.json"
          bash -n install.sh
          bash install.sh
          grep -q '"custom:shell-party:shell-party"' "$CLAUDE_CONFIG_DIR/settings.json"
          bash install.sh
          bash install.sh --uninstall
          grep -q '"theme": "dark"' "$CLAUDE_CONFIG_DIR/settings.json"

  install-windows:
    name: Installer (windows, PowerShell ${{ matrix.shell }})
    needs: plugin
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - name: Install, install again, uninstall
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          $env:CLAUDE_CONFIG_DIR = "$env:RUNNER_TEMP\claude"
          New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null
          Set-Content "$env:CLAUDE_CONFIG_DIR\settings.json" '{"theme":"dark"}'
          .\install.ps1
          if ((Get-Content "$env:CLAUDE_CONFIG_DIR\settings.json" -Raw | ConvertFrom-Json).theme -ne 'custom:shell-party:shell-party') { exit 1 }
          .\install.ps1
          .\install.ps1 -Uninstall
          if ((Get-Content "$env:CLAUDE_CONFIG_DIR\settings.json" -Raw | ConvertFrom-Json).theme -ne 'dark') { exit 1 }
